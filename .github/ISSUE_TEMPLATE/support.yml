name: Sound Cue support request
description: Ask for help with the Sound Cue iPhone app
title: "[Support] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using Sound Cue. This request will be public.
        Do not include personal, payment, health, or other sensitive information.
  - type: dropdown
    id: topic
    attributes:
      label: What do you need help with?
      options:
        - Timer or sound cues
        - Workouts or settings
        - Upgrade or purchase restoration
        - Accessibility
        - Privacy
        - Something else
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Sound Cue version
      description: Find this under Settings → About.
      placeholder: "1.0 (1)"
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: "iOS 26.0"
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: Explain what you expected, what happened instead, and steps we can use to reproduce it.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I understand this request is public and contains no sensitive information.
          required: true
